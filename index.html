<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLAT EARTH SIM</title>
  <meta name="description" content="A cozy pixel-art simulation of the flat earth exactly as its believers describe it: spiralling sun, self-luminous moon, firmament dome, Shadow Object eclipses, ice wall. Not a debunk; a faithful render of the lore.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Flat Earth Sim">
  <meta property="og:description" content="A cozy pixel-art diorama of the flat-earth consensus model: sourced lore, a small living world, no build step.">
  <meta property="og:url" content="https://shanahan-suresh.github.io/flat-earth-sim/">
  <meta property="og:image" content="https://shanahan-suresh.github.io/flat-earth-sim/screenshots/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232e7ea0'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23c8ecff' stroke-width='3'/%3E%3Ccircle cx='13' cy='12' r='4' fill='%236db35a'/%3E%3Ccircle cx='20' cy='19' r='3' fill='%236db35a'/%3E%3Ccircle cx='10' cy='20' r='2' fill='%236db35a'/%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23e8f4f8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Canvas background -->
  <canvas id="canvas"></canvas>
  <div id="fade"></div>

  <!-- Title card: shown once on a plain load, fades out (ui.js) -->
  <div id="title-card" hidden>
    <div class="tc-title">FLAT EARTH</div>
  </div>

  <!-- Day/night dial: sun and moon ride one wheel; sim time turns it -->
  <div id="dial" class="frame" aria-hidden="true">
    <div id="dial-wheel">
      <i class="dial-sun" data-icon="sun"></i>
      <i class="dial-moon" data-icon="moon"></i>
    </div>
  </div>

  <!-- HUD: dock + popovers. Every state input lives in here (autosave listens on #hud). -->
  <div id="hud">
    <div id="dock" class="frame">
      <button id="btn-pause" class="tool" data-tip="Pause"><i data-icon="pause"></i></button>
      <button id="btn-speed" class="tool" data-tip="Speed"><i data-icon="speed1"></i></button>
      <input type="range" id="slider-speed" class="vh" min="0" max="20" value="1" step="0.25" tabindex="-1">
      <div class="season" data-tip="Season">
        <i data-icon="sun"></i>
        <input type="range" id="slider-day" min="0" max="364" value="172">
        <i data-icon="snow"></i>
      </div>
      <span class="sep"></span>
      <button id="btn-edge" class="tool" data-tip="Ice wall"><i data-icon="wall"></i></button>
      <button id="btn-view" class="tool" data-tip="Diorama"><i data-icon="diorama"></i></button>
      <button id="btn-photo" class="tool" data-tip="Photo"><i data-icon="camera"></i></button>
      <label class="tool" data-tip="Sound"><input type="checkbox" id="chk-audio" class="vh"><i data-icon="sound"></i></label>
      <span class="sep"></span>
      <button class="tool" data-pop="pop-sky" data-tip="Sky"><i data-icon="cloud"></i></button>
      <button class="tool" data-pop="pop-map" data-tip="Map"><i data-icon="plane"></i></button>
      <button class="tool" data-pop="pop-alm" data-tip="Almanac"><i data-icon="moon"></i></button>
      <button class="tool" data-pop="pop-info" data-tip="About"><i data-icon="info"></i></button>
    </div>

    <!-- Radio groups behind the cycle buttons (the schema reads these) -->
    <span class="vh">
      <input type="radio" name="edge" id="edge-icewall" value="icewall" checked>
      <input type="radio" name="edge" id="edge-waterfall" value="waterfall">
      <input type="radio" name="edge" id="edge-infinite" value="infinite">
      <input type="radio" name="edge" id="edge-beyond" value="beyond">
      <input type="radio" name="view" id="view-diorama" value="diorama" checked>
      <input type="radio" name="view" id="view-ground" value="ground">
      <input type="radio" name="model" id="model-monopole" value="monopole" checked>
      <input type="radio" name="model" id="model-bipolar" value="bipolar">
    </span>

    <div id="pop-sky" class="pop frame" hidden>
      <div class="grid">
        <label class="tool" data-tip="Dome"><input type="checkbox" id="chk-dome" class="vh" checked><i data-icon="dome"></i></label>
        <label class="tool" data-tip="Clouds"><input type="checkbox" id="chk-clouds" class="vh" checked><i data-icon="cloud"></i></label>
        <label class="tool" data-tip="Rain"><input type="checkbox" id="chk-rain" class="vh" checked><i data-icon="rain"></i></label>
        <label class="tool" data-tip="Sunbeam"><input type="checkbox" id="chk-sunbeam" class="vh" checked><i data-icon="beam"></i></label>
        <label class="tool" data-tip="Aurora"><input type="checkbox" id="chk-aurora" class="vh" checked><i data-icon="aurora"></i></label>
        <label class="tool" data-tip="Stars"><input type="checkbox" id="chk-constellations" class="vh" checked><i data-icon="stars"></i></label>
        <label class="tool" data-tip="Shadow object"><input type="checkbox" id="chk-shadow" class="vh"><i data-icon="shadow"></i></label>
        <button id="btn-model" class="tool" data-tip="One pole"><i data-icon="monopole"></i></button>
      </div>
      <div class="row">
        <i class="dim" data-icon="pixels"></i>
        <input type="range" id="slider-pixel" min="2" max="8" value="4" step="1" data-tip="Pixel size">
        <button id="btn-reset-cam" class="tool" data-tip="Reset view"><i data-icon="reset"></i></button>
        <button id="btn-copy-link" class="tool" data-tip="Copy link"><i data-icon="link"></i></button>
      </div>
    </div>

    <div id="pop-map" class="pop frame" hidden>
      <div class="grid">
        <label class="tool" data-tip="Flights"><input type="checkbox" id="chk-routes" class="vh"><i data-icon="routes"></i></label>
        <label class="tool" data-tip="Pins"><input type="checkbox" id="chk-observers" class="vh"><i data-icon="pin"></i></label>
        <label class="tool" data-tip="Traffic"><input type="checkbox" id="chk-traffic" class="vh" checked><i data-icon="plane"></i></label>
        <label class="tool" data-tip="City lights"><input type="checkbox" id="chk-lights" class="vh" checked><i data-icon="lights"></i></label>
      </div>
    </div>

    <div id="pop-alm" class="pop frame" hidden>
      <div class="grid">
        <button id="btn-alm-fullmoon" class="tool" data-tip="Full moon"><i data-icon="fullmoon"></i></button>
        <button id="btn-alm-eclipse" class="tool" data-tip="Eclipse"><i data-icon="eclipse"></i></button>
        <button id="btn-alm-solstice" class="tool" data-tip="Solstice"><i data-icon="solstice"></i></button>
      </div>
      <div id="postcards-wrap" class="grid"></div>
    </div>

    <div id="pop-info" class="pop frame info" hidden>
      <div class="info-title">FLAT EARTH SIM</div>
      <p>The flat earth as its believers describe it.</p>
      <div class="row">
        <a class="info-link" href="https://github.com/Shanahan-Suresh/flat-earth-sim#readme" target="_blank" rel="noopener">Sources &amp; lore</a>
        <button id="btn-reset-all" class="tool" data-tip="Reset all"><i data-icon="reset"></i></button>
      </div>
    </div>
  </div>

  <!-- Hover label (desktop) -->
  <div id="tip" hidden></div>

  <!-- Photo mode controls -->
  <div id="photo-bar" class="frame">
    <button id="btn-save-png" class="tool" data-tip="Save"><i data-icon="save"></i></button>
    <button id="btn-photo-exit" class="tool" data-tip="Back"><i data-icon="close"></i></button>
  </div>
</body>
</html>
