<!DOCTYPE html>
<html>
<head>
<script type="importmap">{"imports": {"three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/"}}</script>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="report">pending</div>
<script>
window.addEventListener('error', function (e) {
  document.getElementById('report').textContent = 'IMPORT-ERR: ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || '');
});
window.addEventListener('unhandledrejection', function (e) {
  document.getElementById('report').textContent = 'REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
});
</script>
<script type="module">
import * as THREE from 'three';
import { setupLook } from './js/look.js';
import { updateSurface } from './js/surface.js';
import { SimClock, findNextFullMoon, findNextSolstice } from './js/sim.js';
import { buildWorld, buildRain } from './js/world.js';
import { buildSky, updateSky } from './js/sky.js';
import { buildOverlays, buildCityLights, buildTraffic } from './js/overlays.js';

const report = (msg) => {
  document.getElementById('report').textContent = 'REPORT: ' + msg;
  document.title = 'REPORT';
  fetch('/SMOKE_RESULT?msg=' + encodeURIComponent(msg)).catch(() => {});
};
try {
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: false, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x000000, 0);
  renderer.setSize(800, 600);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 800/600, 0.1, 200);
  camera.position.set(11.5, 7.4, 11.5);
  camera.lookAt(0, 0, 0);
  scene.add(new THREE.AmbientLight(0xb4bfe6, 0.85));
  scene.add(new THREE.HemisphereLight(0xb0c0ff, 0x6a5a48, 0.75));
  const look = setupLook(renderer, scene, camera);
  look.setSize(800, 600);
  const world = buildWorld(scene);
  const sky = buildSky(scene);
  const rain = buildRain(scene);
  const overlays = buildOverlays(scene);
  const cityLights = buildCityLights(scene);
  const traffic = buildTraffic(scene, overlays.routeCurves);
  const sim = new SimClock();
  const toggles = { dome: true, clouds: true, sunBeam: true, shadowObject: false, traffic: true, lights: true, rain: true, constellations: true };
  updateSky(sky, sim, toggles);
  updateSurface(sim, 0);
  look.composer.render();
  const gl = renderer.getContext();
  const px = new Uint8Array(800 * 600 * 4);
  gl.readPixels(0, 0, 800, 600, gl.RGBA, gl.UNSIGNED_BYTE, px);
  // The sky backdrop fills every pixel, so "lit" counts the scene's brighter
  // pixels (land, water, ice) against the dark sky; colours are 3-bit-per-channel bins.
  let lit = 0, colorSet = new Set();
  for (let i = 0; i < px.length; i += 4) {
    if (px[i] + px[i+1] + px[i+2] > 240) lit++;
    colorSet.add((px[i]>>5)+','+(px[i+1]>>5)+','+(px[i+2]>>5));
  }
  const fullMoon = findNextFullMoon(0);
  const solstice = findNextSolstice(0);
  report('lit=' + lit + '/480000 distinctColors=' + colorSet.size + ' objectsInScene=' + scene.children.length + ' fullMoon=' + fullMoon.toFixed(1) + ' solstice=' + solstice.label);
} catch (e) {
  report('EXCEPTION: ' + e.message + ' | ' + (e.stack || '').slice(0, 300));
}
</script>
</body>
</html>
